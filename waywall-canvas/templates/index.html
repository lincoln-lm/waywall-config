<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            color: white;
            margin: 0px auto;
            overflow: hidden;
            font-family: Maple Mono;
            font-size: 1.25em;
            text-align: center;
            text-shadow:
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000;
        }

        p {
            margin: 0px;
        }
    </style>
    <script>
        let canvas;
        let ctx;

        window.addEventListener('load', () => {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            let mousePoints = [];
            let trail = [];

            const params = new URLSearchParams(window.location.search);
            const RADIUS = parseInt(params.get("radius")) || 12;
            const SPACING = parseInt(params.get("spacing")) || 5;
            const FAR_DISTANCE = parseInt(params.get("fardist")) || 500;
            const FADE = parseFloat(params.get("fade")) || 0.90;
            const FAR_FADE = parseFloat(params.get("farfade")) || 0.50;
            const COLOR_1 = params.get("color1") || "BE92D0";
            const COLOR_2 = params.get("color2") || "FFBEFF";

            const catmullRomSpline = (p0, p1, p2, p3, t) => {
                const t2 = t * t;
                const t3 = t2 * t;

                const interpolate = (a, b, c, d) => {
                    return 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
                };

                return {
                    x: interpolate(p0.x, p1.x, p2.x, p3.x),
                    y: interpolate(p0.y, p1.y, p2.y, p3.y)
                };
            }

            const eventSource = new EventSource("/data");
            const onFrame = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                trail = trail.filter(point => point.life > 0.01);
                for (const [i, point] of trail.entries()) {
                    const gradient = ctx.createRadialGradient(
                        point.x,
                        point.y,
                        0,
                        point.x,
                        point.y,
                        RADIUS
                    );
                    gradient.addColorStop(0, "#" + COLOR_1 + Math.round(point.life * 255).toString(16).toUpperCase().padStart(2, '0'));
                    gradient.addColorStop(1, "#" + COLOR_2 + "00");
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, RADIUS, 0, Math.PI * 2);
                    ctx.fill();
                    let distance = 0;
                    for (let j = trail.length - 1; j > i; j--) {
                        distance += Math.hypot(
                            trail[j].x - trail[j - 1].x,
                            trail[j].y - trail[j - 1].y
                        );

                    }
                    point.life *= distance > FAR_DISTANCE ? FAR_FADE : FADE;
                }
                requestAnimationFrame(onFrame);
            }
            const addData = (data) => {
                mousePoints.push(data);
                const n = mousePoints.length;
                // can't interpolate from only 1 point
                if (n === 1) {
                    trail.push({ ...data, life: 1 });
                    return;
                }
                const p1 = mousePoints[n - 2];
                const p2 = mousePoints[n - 1];

                const distance = Math.hypot(
                    p2.x - p1.x,
                    p2.y - p1.y
                );

                const steps = Math.max(1, Math.ceil(distance / SPACING));
                // not enough points for catmull rom, linearly interpolate
                if (n === 2) {
                    for (let i = 1; i <= steps; i++) {
                        const t = i / steps;
                        trail.push({
                            x: p1.x + (p2.x - p1.x) * t,
                            y: p1.y + (p2.y - p1.y) * t,
                            life: 1
                        });
                    }
                    return;
                }
                // catmull rom spline
                const p0 = mousePoints[n - 3];
                const p3 = n >= 3 ? {
                    x: 2 * p2.x - p1.x,
                    y: 2 * p2.y - p1.y
                }
                    : p2;

                for (let i = 1; i <= steps; i++) {
                    const t = i / steps;
                    const point = catmullRomSpline(p0, p1, p2, p3, t);

                    trail.push({
                        x: point.x,
                        y: point.y,
                        life: 1
                    });
                }
            };
            canvas.addEventListener('pointermove', (event) => {
                addData({
                    x: event.clientX,
                    y: event.clientY
                });
            });
            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                addData(data);
            }
            onFrame();
        });
    </script>
</head>

<body>
    <div id="all" style="width: 100%;">
        <canvas width="2560" height="1600" id="canvas"></canvas>
    </div>
</body>

</html>
